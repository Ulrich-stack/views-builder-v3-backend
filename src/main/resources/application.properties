spring.application.name=builder-backend
server.port=8080

# Configuration Gemini IA
gemini.api.key=${GEMINI_API_KEY}
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta
# Modèle utilisé pour la génération (modifiable sans toucher au code)
gemini.model=gemini-3.6-flash
# Niveau de réflexion du modèle : low (rapide) ou high (plus lent, parfois plus soigné)
gemini.thinking-level=low

# Photos des pages générées, par ordre de préférence (sans aucune clé, Openverse est utilisé)
# Unsplash : clé d'accès gratuite sur https://unsplash.com/developers
unsplash.access-key=${UNSPLASH_ACCESS_KEY:}
# Pexels : https://www.pexels.com/api/ (nouvelles clés suspendues en octobre 2026)
pexels.api.key=${PEXELS_API_KEY:}
